<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img"><title>软件流程：每图检查与批次结束后的最终提交</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#344b60"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif;fill:#152d42}path{fill:none;stroke:#344b60;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect width="1000" height="1110" fill="white"/>
<text x="36" y="45" font-size="28" text-anchor="start" font-weight="600">软件流程：每图检查与批次结束后的最终提交</text>
<text x="36" y="77" font-size="20" text-anchor="start">源码 bd5d8cc · 报告精简框图</text>
<rect x="200" y="105" width="600" height="85" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="500.0" y="147.5" font-size="20" text-anchor="middle" font-weight="600">批次初始化</text>
<text x="500.0" y="179.5" font-size="20" text-anchor="middle">模型 / CPU 与 Runner 会话 / owner</text>
<rect x="30" y="225" width="940" height="540" rx="12" fill="#f6fafc" stroke="#b1c6d2" stroke-width="1.6"/>
<text x="52" y="260" font-size="20" text-anchor="start" font-weight="600">每图重复：会话保持常驻</text>
<rect x="90" y="300" width="365" height="90" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="272.5" y="345.0" font-size="20" text-anchor="middle" font-weight="600">输入与整图推理</text>
<text x="272.5" y="377.0" font-size="20" text-anchor="middle">BEGIN → 36 PL → END</text>
<rect x="545" y="300" width="365" height="90" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="727.5" y="345.0" font-size="20" text-anchor="middle" font-weight="600">生成比对与排名结果</text>
<text x="727.5" y="377.0" font-size="20" text-anchor="middle">计时外 · 结果尚待最终提交</text>
<rect x="545" y="455" width="365" height="90" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="727.5" y="500.0" font-size="20" text-anchor="middle" font-weight="600">每图 INFO 检查</text>
<text x="727.5" y="532.0" font-size="20" text-anchor="middle">保护区 / 静态权重 / 计数</text>
<rect x="90" y="455" width="365" height="90" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="272.5" y="500.0" font-size="20" text-anchor="middle" font-weight="600">暂存本图结果</text>
<text x="272.5" y="532.0" font-size="20" text-anchor="middle">INFO 通过，设备尚未关闭</text>
<rect x="90" y="625" width="365" height="85" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="272.5" y="667.5" font-size="20" text-anchor="middle" font-weight="600">继续本批？</text>
<text x="272.5" y="699.5" font-size="20" text-anchor="middle">还有图片且预算、检查均通过</text>
<path d="M500 190 L500 280 L272 280 L272 300"/>
<path d="M455 345 L545 345"/>
<path d="M727 390 L727 455"/>
<path d="M545 500 L455 500"/>
<path d="M272 545 L272 625"/>
<path d="M90 667 L60 667 L60 345 L90 345"/>
<text x="32" y="610" font-size="20" text-anchor="start">是</text>
<rect x="40" y="835" width="275" height="100" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="177.5" y="885.0" font-size="20" text-anchor="middle" font-weight="600">批次关闭会话</text>
<text x="177.5" y="917.0" font-size="20" text-anchor="middle">CPU session / Runner</text>
<rect x="365" y="835" width="275" height="100" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="502.5" y="885.0" font-size="20" text-anchor="middle" font-weight="600">owner STOP / 退出</text>
<text x="502.5" y="917.0" font-size="20" text-anchor="middle">取得设备关闭证明</text>
<rect x="690" y="835" width="275" height="100" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="827.5" y="885.0" font-size="20" text-anchor="middle" font-weight="600">最终验收提交</text>
<text x="827.5" y="917.0" font-size="20" text-anchor="middle">每图 accuracy / commit</text>
<path d="M272 710 L272 790 L177 790 L177 835"/>
<text x="370" y="787" font-size="20" text-anchor="middle">否：结束本批</text>
<path d="M315 885 L365 885"/>
<path d="M640 885 L690 885"/>
<text x="40" y="1000" font-size="20" text-anchor="start" font-weight="600">比对结果生成 ≠ 最终验收提交。INFO 是每图检查，不关闭会话。</text>
<text x="40" y="1042" font-size="20" text-anchor="start">批次结束后关闭会话、停止 owner；关闭证明通过后才提交验收记录。</text>
</svg>
