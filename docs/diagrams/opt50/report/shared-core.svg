<rect x="760" y="205" width="210" height="100" rx="10" fill="#e4f4ee" stroke="#59798f" stroke-width="1.8"/>
<text x="865.0" y="255.0" font-size="20" text-anchor="middle" font-weight="600">32×16 MAC</text>
<text x="865.0" y="287.0" font-size="20" text-anchor="middle">共享 512 路</text>
<rect x="410" y="405" width="260" height="90" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="540.0" y="450.0" font-size="20" text-anchor="middle" font-weight="600">X 行缓存</text>
<text x="540.0" y="482.0" font-size="20" text-anchor="middle">按每列位置选取激活</text>
<rect x="760" y="405" width="210" height="90" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="865.0" y="450.0" font-size="20" text-anchor="middle" font-weight="600">结果块缓冲</text>
<text x="865.0" y="482.0" font-size="20" text-anchor="middle">计算 / 写回交接</text>
<rect x="410" y="585" width="260" height="90" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="540.0" y="630.0" font-size="20" text-anchor="middle" font-weight="600">Burst 写回</text>
<text x="540.0" y="662.0" font-size="20" text-anchor="middle">128 bit</text>
<rect x="30" y="585" width="280" height="90" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="170.0" y="630.0" font-size="20" text-anchor="middle" font-weight="600">DDR 输出 Y</text>
<text x="170.0" y="662.0" font-size="20" text-anchor="middle">INT32</text>
