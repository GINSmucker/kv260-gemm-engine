<rect x="30" y="125" width="280" height="90" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="170.0" y="170.0" font-size="20" text-anchor="middle" font-weight="600">Dense 权重</text>
<text x="170.0" y="202.0" font-size="20" text-anchor="middle">mode=0：完整 W</text>
