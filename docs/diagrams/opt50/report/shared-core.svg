<text x="170.0" y="330.0" font-size="20" text-anchor="middle" font-weight="600">2:4 Sparse 权重</text>
<text x="170.0" y="362.0" font-size="20" text-anchor="middle">mode=1：保留值 + 位置码</text>
<rect x="410" y="205" width="260" height="100" rx="10" fill="#eef6fa" stroke="#59798f" stroke-width="1.8"/>
<text x="540.0" y="255.0" font-size="20" text-anchor="middle" font-weight="600">共用取数与选择</text>
