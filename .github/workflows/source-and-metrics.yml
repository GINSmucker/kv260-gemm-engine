name: Source and recorded metrics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -B tools/check_release.py
      - run: python -B tools/check_docs.py
      - run: python -B -m unittest discover -s tests -v
