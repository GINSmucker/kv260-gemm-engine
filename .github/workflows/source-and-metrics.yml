name: Source and recorded metrics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -B tools/check_release.py
      - run: python -B tools/check_docs.py
      - run: python -B -m unittest discover -s tests -v
      - run: node --test --test-isolation=none board/ui/tests/workbench.test.mjs board/ui/tests/charts.test.mjs board/ui/tests/final.test.mjs board/ui/tests/sparse24.test.mjs
